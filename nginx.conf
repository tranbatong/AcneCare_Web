server {
    listen       80;
    server_name  localhost;

    # Phục vụ file tĩnh của React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API đến Backend Server thực tế
    location /api/ {
        proxy_pass https://api.acnecare.io.vn/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cấu hình để trình duyệt nhận diện cookie chính xác theo setting của Spring Boot
        proxy_cookie_path / "/; HTTPOnly; SameSite=Lax";
    }
}